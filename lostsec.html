<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoPromotes — Control</title>
  <!-- GoPromotes control panel — PRIVATE. This page is intentionally NOT
       linked from any public page, nav, or sitemap; robots.txt disallows it;
       and it is marked noindex/nofollow below. Reachable only by its direct
       URL. Real access control is Firebase Auth + the adminEmails allow-list
       (firebase-config.js) — there is no passphrase gate anymore. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0a5a38">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ================= LOGIN GATE ================= -->
  <div id="gate" class="hidden">
    <div class="gate-card" id="gateCard">
      <div class="gate-logo"><img src="logo-mark.svg" alt="GoPromotes" width="56" height="56" style="display:block;border-radius:14px"></div>
      <h1>GoPromotes Control</h1>
      <p class="sub">Manage your affiliate site</p>
      <div class="gate-error" id="gateError"></div>

      <!-- Firebase Auth sign-in (the ONLY login — no passphrase gate) -->
      <div id="fbAuth">
        <label for="fbEmail">Email</label>
        <input type="email" id="fbEmail" placeholder="you@example.com" autocomplete="username" spellcheck="false">
        <label for="fbPass">Password</label>
        <input type="password" id="fbPass" placeholder="Your password" autocomplete="current-password">
        <button type="button" class="btn btn-primary" id="fbLoginBtn">Sign in securely</button>
        <div class="or-divider" id="fbOr"><span>or</span></div>
        <button type="button" class="btn btn-google" id="fbGoogleBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.66-.22-2.45H12v4.64h6.45a5.52 5.52 0 0 1-2.4 3.62v3h3.88c2.27-2.1 3.57-5.17 3.57-8.81z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.88-3c-1.08.72-2.45 1.15-4.06 1.15-3.13 0-5.78-2.11-6.72-4.95H1.27v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.28 14.29a7.2 7.2 0 0 1 0-4.58v-3.1H1.27a12 12 0 0 0 0 10.78l4.01-3.1z"/><path fill="#EA4335" d="M12 4.76c1.77 0 3.35.61 4.6 1.8l3.43-3.43A11.98 11.98 0 0 0 1.27 6.61l4.01 3.1C6.22 6.87 8.87 4.76 12 4.76z"/></svg>
          Continue with Google
        </button>
      </div>
    </div>
  </div>

  <!-- ================= APP ================= -->
  <div id="app" class="hidden">
    <aside class="sidebar">
      <div class="side-logo"><span class="mark"><img src="logo-mark.svg" alt="GoPromotes" width="34" height="34" style="display:block;border-radius:9px"></span><span>GoPromotes<small>control panel</small></span></div>
      <nav class="side-nav">
        <button data-view="dashboard" class="active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-6 4 3 5-8"/></svg>
          Dashboard &amp; stats
        </button>
        <button data-view="links">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
          Affiliate links
        </button>
        <button data-view="categories">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7l2 2h7v12H4z"/><path d="M4 9h16"/></svg>
          Categories
        </button>
        <button data-view="settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </button>
      </nav>
      <div class="side-bottom">
        <a href="index.html" target="_blank" rel="noopener">&#8599; Open public site</a>
        <button class="logout" id="logoutBtn">Log out</button>
      </div>
    </aside>
    <main class="main">
      <div id="view"></div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <!-- scripts (admin-config.js = secret-free runtime config; Firebase Auth
       config = the ONLY auth — no passphrase gate exists anymore) -->
  <script src="posts-manifest.js"></script>
  <script src="admin-config.js"></script>
  <script src="firebase-config.js"></script>
  <script src="analytics.js"></script>
  <script src="affiliate-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
